[package]
name = "axiom-runtime"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Axiom3 agent-runtime integration (Rig) + provider adapters."

[dependencies]
rig-core = "0.39"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1"
futures = "0.3"
axiom-core = { path = "../axiom-core" }
axiom-providers = { path = "../axiom-providers" }

[dev-dependencies]
axiom-ingest = { path = "../axiom-ingest" }
axiom-core = { path = "../axiom-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
