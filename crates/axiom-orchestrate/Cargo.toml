[package]
name = "axiom-orchestrate"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Axiom3 dynamic multi-agent orchestration engine (workflow + coding). Free-form work, never verdicts."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
axiom-runtime = { path = "../axiom-runtime" }
axiom-providers = { path = "../axiom-providers" }
# Thompson sampling for AB-MCTS (Beta posteriors over candidate/model arms). Seedable
# StdRng keeps the search deterministic under a fixed seed (tests) while defaulting to
# entropy in production. Versions match what the workspace already resolves.
rand = "0.9"
rand_distr = "0.5"
# RED-LINE FIREWALL: axiom-orchestrate MUST NOT depend on axiom-core (the verdict
# types: VerdictStatus / Independence / adjudicate_fleet). This tier produces free-form
# work and never judges truth. The dependency edge is intentionally absent; a CI grep
# guards `use axiom_core` from creeping into this crate's source.

# Kill a runaway kernel by process GROUP on timeout (so grandchildren die and the reader
# thread gets EOF instead of blocking forever). Unix only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
