[package]
name = "axiom-providers"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Axiom3 model-access layer: canonical message model (Anthropic-rich), capability matrix (status/sunset), and role-based routing with cross-vendor independence."

[dependencies]
axiom-core = { path = "../axiom-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
