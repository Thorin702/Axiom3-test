name: Windows Build

# Builds the Windows NSIS installer in the cloud so we don't depend on a local Windows toolchain.
# Trigger manually (Actions tab → Run workflow, or `gh workflow run windows-build.yml`) or by pushing
# a version tag (v1.0.34, …). No secrets needed at build time — signing is deferred, keys are runtime.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # prost-build (a transitive dep) invokes protoc at build time — one of the original Windows
      # blockers. setup-protoc puts it on PATH.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # pnpm 11: the project's pnpm-workspace.yaml uses pnpm-10/11 config keys (allowBuilds,
      # verifyDepsBeforeRun). pnpm 9 misreads that file as a workspace def and dies with
      # "packages field missing or empty". Match the local toolchain (11.x).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: axiom3-desktop/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: axiom3-desktop
        run: pnpm install --frozen-lockfile

      # NSIS only — skip the MSI/WiX target (slower + flakier). The workspace target/ lives at the
      # repo root, so the bundle lands in ./target/release/bundle/nsis/ regardless of working-directory.
      - name: Build Tauri (NSIS installer)
        working-directory: axiom3-desktop
        env:
          # The committed release profile (fat LTO + codegen-units=1, for smallest binary) is too slow
          # to LINK on the 2-core CI runner — it blew past the 60-min job timeout. Override to thin LTO
          # + parallel codegen for CI ONLY (~2-3x faster link, negligible runtime difference for a
          # desktop app). Local/Mac release builds still use the committed fat-LTO profile.
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: pnpm tauri build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: axiom3-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
