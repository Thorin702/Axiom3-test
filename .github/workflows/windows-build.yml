name: Windows Build

# Builds the Windows NSIS installer in the cloud so we don't depend on a local Windows toolchain.
# Trigger manually (Actions tab → Run workflow, or `gh workflow run windows-build.yml`) or by pushing
# a version tag (v1.0.34, …). No secrets needed at build time — signing is deferred, keys are runtime.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Save the compiled-deps cache even when the build fails — the first cold build is the slow
          # one; once it caches, later runs drop to ~10 min. (A timeout-cancel still can't save, so we
          # also lower the opt-level below to make the cold build fit.)
          cache-on-failure: true

      # prost-build (a transitive dep) invokes protoc at build time — one of the original Windows
      # blockers. setup-protoc puts it on PATH.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # pnpm 11: the project's pnpm-workspace.yaml uses pnpm-10/11 config keys (allowBuilds,
      # verifyDepsBeforeRun). pnpm 9 misreads that file as a workspace def and dies with
      # "packages field missing or empty". Match the local toolchain (11.x).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: axiom3-desktop/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: axiom3-desktop
        run: pnpm install --frozen-lockfile

      # NSIS only — skip the MSI/WiX target (slower + flakier). The workspace target/ lives at the
      # repo root, so the bundle lands in ./target/release/bundle/nsis/ regardless of working-directory.
      - name: Build Tauri (NSIS installer)
        working-directory: axiom3-desktop
        env:
          # The committed release profile (opt-level=s + fat LTO + codegen-units=1, for smallest
          # binary) makes a COLD build on the 2-core CI runner blow past even a 90-min timeout — the
          # bottleneck is compiling hundreds of heavy dep crates (arrow/lance/…), which optimization
          # level dominates. Override to opt-level=1 + no LTO + parallel codegen for CI ONLY: a
          # functional test installer that compiles ~2x faster. Local/Mac release keeps the committed
          # fat-LTO profile (smallest, most optimized). Once one CI build completes, the dep cache
          # makes later runs ~10 min regardless.
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
          CARGO_PROFILE_RELEASE_DEBUG: "false"
          CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
        run: pnpm tauri build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: axiom3-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
