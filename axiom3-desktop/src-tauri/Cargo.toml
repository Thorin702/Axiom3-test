[package]
name = "axiom3-desktop"
version = "1.43.9"
description = "Axiom3 desktop shell"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "axiom3_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
# Name-derived project ids (collision-resistant slug suffix).
blake3 = "1"

# Open-core verification engine (MIT). One-way dependency: shell -> core.
axiom-core = { path = "../../crates/axiom-core" }
# Storage + secrets + vector tiers the shell orchestrates.
axiom-store = { path = "../../crates/axiom-store" }
axiom-secrets = { path = "../../crates/axiom-secrets" }
axiom-vector = { path = "../../crates/axiom-vector" }
# Agent runtime: the model-verification fleet (cross-vendor) for bearing claims.
axiom-runtime = { path = "../../crates/axiom-runtime" }
# Dynamic multi-agent orchestration engine (workflow + coding). Free-form work tier.
axiom-orchestrate = { path = "../../crates/axiom-orchestrate" }
# Document text extraction (pdf / docx / txt-md) for upload-and-check.
axiom-ingest = { path = "../../crates/axiom-ingest" }
tokio = { version = "1.52.3", features = ["time"] }

# Single-instance guard (desktop only) — prevents two processes racing first-run
# DB-key creation for the same project (see axiom-secrets::get_or_create_db_key).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# Restore window size/position/maximized across launches (feature-list #2).
tauri-plugin-window-state = "2"

[dev-dependencies]
tempfile = "3"

