<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background is Claude's orange (#D97757 — the same value the app's dark theme uses for its
       accent variable), with a light tint above and a deeper shade below purely for dimension. The
       midpoint carries the brand colour so the icon reads as that orange at every size.
       NOTE: an XML comment may not contain a doubled hyphen, so no CSS custom-property names here. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <!-- FLAT fill, no gloss. The previous version layered a white radial highlight and a bright ellipse
       over the fill; measured on the rendered PNG that lifted the surface to #DE896C, a washed-out
       dusty terracotta rather than the requested orange. A brand colour has to be the colour that
       actually reaches the screen, so nothing is painted over it now — only a hairline rim, which
       stays because a flat tile needs one edge cue to read as a tile on both light and dark docks. -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#D97757"/>
  <rect x="104" y="104" width="816" height="816" rx="182" ry="182" fill="none" stroke="url(#rim)" stroke-width="3.5"/>
  <!-- The graph mark, scaled 11 → 13.5 (+23% linear). Its local bounding box, circle radii included,
       spans x 9.7‑44.3 and y 7.7‑47.3, so the translate that keeps it centred on the 1024 canvas is
       512 − 27·s horizontally and 512 − 27.5·s vertically. The shadow copy keeps its 6px drop offset,
       scaled with the mark. -->
  <g transform="translate(147.5,148.1) scale(13.5)" fill="#8A3B1E" fill-opacity="0.16" stroke="#8A3B1E" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round">
    <path d="M13 15 L30 11 M30 11 L41 21 M13 15 L24 30 M30 11 L24 30 M41 21 L38 35 M24 30 L38 35 M24 30 L16 42 M38 35 L31 43 M16 42 L31 43" fill="none"/>
    <circle cx="13" cy="15" r="3.3"/><circle cx="30" cy="11" r="3.3"/><circle cx="41" cy="21" r="3.3"/><circle cx="24" cy="30" r="4.3"/><circle cx="38" cy="35" r="3.3"/><circle cx="16" cy="42" r="3.3"/><circle cx="31" cy="43" r="3.3"/>
  </g>
  <g transform="translate(147.5,140.75) scale(13.5)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <path d="M13 15 L30 11 M30 11 L41 21 M13 15 L24 30 M30 11 L24 30 M41 21 L38 35 M24 30 L38 35 M24 30 L16 42 M38 35 L31 43 M16 42 L31 43"/>
    <g fill="#FFFFFF" stroke="none">
      <circle cx="13" cy="15" r="3.3"/><circle cx="30" cy="11" r="3.3"/><circle cx="41" cy="21" r="3.3"/><circle cx="24" cy="30" r="4.3"/><circle cx="38" cy="35" r="3.3"/><circle cx="16" cy="42" r="3.3"/><circle cx="31" cy="43" r="3.3"/>
    </g>
  </g>
</svg>
